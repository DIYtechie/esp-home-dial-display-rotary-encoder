# Full dashboard example. Replace example entities and source names before use.
external_components:
  - source:
      type: local
      path: ../components
    refresh: 0s
    components:
      - viewesmart_rotary_encoder
      - viewesmart_knob_button
      - viewesmart_touchscreen

image:
  - id: volume_prevplaynext_icon
    file: prevplaynext.png
    type: RGB565
    transparency: chroma_key
  - id: volume_prevpausenext_icon
    file: prevpausenext.png
    type: RGB565
    transparency: chroma_key

font:
  - file: "gfonts://Montserrat"
    id: digital_clock_font_96
    size: 96
    bpp: 4


esphome:
  name: dial-display
  friendly_name: Dial Display
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(current_volume_percent) = 50;
          id(current_brightness_percent) = 100;
          id(current_blinds_percent) = 90;
          id(current_skylights_percent) = 90;
          id(current_input_selection) = 1;
          id(last_input_encoder_value) = 17;
          id(light_on) = true;
          id(blinds_open) = true;
          id(skylights_open) = true;
      - sensor.viewesmart_rotary_encoder.set_value:
          id: knob_encoder
          value: 50
      - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
          id: knob_encoder
          acceleration_mode: LOW

      - lvgl.arc.update:
          id: volume_arc
          value: 50
          indicator:
            arc_color: 0x7005FC
      - lvgl.label.update:
          id: volume_value
          text: "50 %"
          text_font: montserrat_48
          y: 200

      - lvgl.arc.update:
          id: brightness_arc
          value: 100
          indicator:
            arc_color: 0xFFC34D
      - lvgl.label.update:
          id: brightness_value
          text: "100 %"
      - lvgl.label.update:
          id: brightness_title
          text: "LIGHTS"

      - script.execute: update_blinds_ui
      - lvgl.label.update:
          id: blinds_title
          text: "BLINDS"
          y: 0
      - script.execute: update_skylights_ui
      - lvgl.label.update:
          id: skylights_title
          text: "SKYLIGHTS"
          y: 0
      - script.execute: update_input_ui
      - lvgl.label.update:
          id: input_title
          text: "SOURCE"
          y: 0

      - lvgl.page.show: volume_page
      - lambda: |-
          id(display_enabled) = true;
          id(round_display).set_brightness(id(display_brightness));
          id(last_user_interaction_ms) = millis();
      - lvgl.resume:
      - script.execute: update_apple_tv_transport_icon
      - number.set:
          id: display_brightness_slider
          value: !lambda "return id(display_brightness);"
      - delay: 5s
      - script.execute: sync_room_blinds_to_display
      - script.execute: sync_skylights_to_display
      - script.execute: sync_selected_source_to_display
      - script.execute: update_clock_pages

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Dial-Display Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: /1
        then:
          - script.execute: update_clock_pages

psram:
  mode: octal
  speed: 80MHz

globals:
  - id: current_volume_percent
    type: int
    restore_value: no
    initial_value: "50"

  - id: current_brightness_percent
    type: int
    restore_value: no
    initial_value: "100"

  - id: current_blinds_percent
    type: int
    restore_value: no
    initial_value: "90"

  - id: current_skylights_percent
    type: int
    restore_value: no
    initial_value: "90"

  - id: current_input_selection
    type: int
    restore_value: no
    initial_value: "1"

  - id: last_input_encoder_value
    type: int
    restore_value: no
    initial_value: "17"

  - id: syncing_local
    type: bool
    restore_value: no
    initial_value: "false"

  - id: max_volume_percent
    type: int
    restore_value: no
    initial_value: "70"

  - id: page_menu_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: page_menu_selection
    type: int
    restore_value: no
    initial_value: "0"

  - id: page_menu_origin
    type: int
    restore_value: no
    initial_value: "0"

  - id: page_menu_encoder_value
    type: int
    restore_value: no
    initial_value: "50"

  - id: page_menu_drag_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: page_menu_drag_start_x
    type: int
    restore_value: no
    initial_value: "0"

  - id: page_menu_drag_start_y
    type: int
    restore_value: no
    initial_value: "0"

  - id: page_menu_drag_offset
    type: int
    restore_value: no
    initial_value: "0"

  - id: page_menu_drag_snap_steps
    type: int
    restore_value: no
    initial_value: "0"

  - id: page_menu_selection_changed
    type: bool
    restore_value: no
    initial_value: "false"

  - id: light_on
    type: bool
    restore_value: no
    initial_value: "true"

  - id: blinds_open
    type: bool
    restore_value: no
    initial_value: "true"

  - id: skylights_open
    type: bool
    restore_value: no
    initial_value: "true"

  - id: touch_mode_switch_ready
    type: bool
    restore_value: no
    initial_value: "true"

  - id: center_touch_tap_pending
    type: bool
    restore_value: no
    initial_value: "false"

  - id: tv_touch_tap_pending
    type: bool
    restore_value: no
    initial_value: "false"

  - id: tv_touch_sector
    type: int
    restore_value: no
    initial_value: "0"

  - id: last_local_volume_change_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_local_brightness_change_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_local_blinds_change_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_local_skylights_change_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_local_source_change_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: blinds_sync_block_ms
    type: uint32_t
    restore_value: no
    initial_value: "60000"

  - id: last_sent_volume_percent
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_sent_brightness_percent
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_sent_light_on
    type: bool
    restore_value: no
    initial_value: "false"

  - id: last_sent_blinds_percent
    type: int
    restore_value: no
    initial_value: "-1"

  - id: last_sent_skylights_percent
    type: int
    restore_value: no
    initial_value: "-1"

  - id: display_enabled
    type: bool
    restore_value: no
    initial_value: "true"

  - id: display_brightness
    type: int
    restore_value: no
    initial_value: "208"

  - id: last_user_interaction_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: display_idle_timeout_ms
    type: uint32_t
    restore_value: no
    initial_value: "600000"

  - id: apple_tv_assumed_state_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: apple_tv_assumed_playing
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: wake_display_if_needed
    mode: restart
    then:
      - if:
          condition:
            lambda: "return !id(display_enabled);"
          then:
            - switch.turn_on: display_power_switch

  - id: update_apple_tv_transport_icon
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (id(apple_tv_assumed_state_active)) {
                return id(apple_tv_assumed_playing);
              }
              return id(apple_tv_state).has_state() &&
                     id(apple_tv_state).state == "playing";
          then:
            - lvgl.image.update:
                id: volume_play_pause_badge
                src: volume_prevpausenext_icon
          else:
            - lvgl.image.update:
                id: volume_play_pause_badge
                src: volume_prevplaynext_icon

  - id: mark_display_activity
    mode: restart
    then:
      - lambda: |-
          id(last_user_interaction_ms) = millis();
  - id: sync_receiver_volume_to_display
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (isnan(id(receiver_volume_level).state)) {
                return false;
              }
              const uint32_t now = millis();
              if ((now - id(last_local_volume_change_ms)) < 2000) {
                return false;
              }
              int v = (int) lroundf(id(receiver_volume_level).state * 100.0f);
              if (v < 0) v = 0;
              if (v > 100) v = 100;
              return v != id(current_volume_percent);
          then:
            - lambda: |-
                int v = (int) lroundf(id(receiver_volume_level).state * 100.0f);
                if (v < 0) v = 0;
                if (v > 100) v = 100;
                id(current_volume_percent) = v;
                id(last_sent_volume_percent) = v;
            - if:
                condition:
                  lvgl.page.is_showing: volume_page
                then:
                  - lambda: "id(syncing_local) = true;"
                  - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                      id: knob_encoder
                      acceleration_mode: LOW
                  - sensor.viewesmart_rotary_encoder.set_value:
                      id: knob_encoder
                      value: !lambda "return id(current_volume_percent);"
                  - script.execute: update_volume_ui

  - id: send_receiver_volume_if_changed
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(current_volume_percent) != id(last_sent_volume_percent);"
          then:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: media_player.example_receiver
                  volume_level: !lambda "return id(current_volume_percent) / 100.0f;"
            - lambda: "id(last_sent_volume_percent) = id(current_volume_percent);"

  - id: send_receiver_volume_debounced
    mode: restart
    then:
      - delay: 100ms
      - script.execute: send_receiver_volume_if_changed

  - id: sync_room_brightness_to_display
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (!id(room_light_is_on).has_state()) {
                return false;
              }
              const uint32_t now = millis();
              if ((now - id(last_local_brightness_change_ms)) < 2000) {
                return false;
              }

              const bool desired_on = id(room_light_is_on).state;
              int desired_brightness = id(current_brightness_percent);

              if (desired_on && !isnan(id(room_light_brightness).state)) {
                desired_brightness = (int) lroundf((id(room_light_brightness).state / 255.0f) * 100.0f);
              }

              if (desired_brightness < 0) desired_brightness = 0;
              if (desired_brightness > 100) desired_brightness = 100;
              desired_brightness = ((desired_brightness + 1) / 2) * 2;

              return desired_on != id(light_on) ||
                     (desired_on && desired_brightness != id(current_brightness_percent));
          then:
            - lambda: |-
                const bool desired_on = id(room_light_is_on).state;
                int desired_brightness = id(current_brightness_percent);

                if (desired_on && !isnan(id(room_light_brightness).state)) {
                  desired_brightness = (int) lroundf((id(room_light_brightness).state / 255.0f) * 100.0f);
                }

                if (desired_brightness < 0) desired_brightness = 0;
                if (desired_brightness > 100) desired_brightness = 100;
                desired_brightness = ((desired_brightness + 1) / 2) * 2;

                id(light_on) = desired_on;
                if (desired_on) {
                  id(current_brightness_percent) = desired_brightness;
                  id(last_sent_brightness_percent) = desired_brightness;
                }
                id(last_sent_light_on) = desired_on;
            - if:
                condition:
                  lvgl.page.is_showing: brightness_page
                then:
                  - lambda: "id(syncing_local) = true;"
                  - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                      id: knob_encoder
                      acceleration_mode: HIGH
                  - sensor.viewesmart_rotary_encoder.set_value:
                      id: knob_encoder
                      value: !lambda "return id(current_brightness_percent);"
                  - script.execute: update_brightness_ui

  - id: reconcile_room_brightness_after_local
    mode: restart
    then:
      - delay: 2s
      - script.execute: sync_room_brightness_to_display

  - id: send_room_light_if_changed
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(light_on) != id(last_sent_light_on) ||
                     (id(light_on) && id(current_brightness_percent) != id(last_sent_brightness_percent));
          then:
            - if:
                condition:
                  lambda: "return !id(light_on) || id(current_brightness_percent) <= 0;"
                then:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: light.example_room
                  - lambda: |-
                      id(last_sent_light_on) = false;
                      id(last_sent_brightness_percent) = id(current_brightness_percent);
                else:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: light.example_room
                        brightness_pct: !lambda "return id(current_brightness_percent);"
                  - lambda: |-
                      id(last_sent_light_on) = true;
                      id(last_sent_brightness_percent) = id(current_brightness_percent);

  - id: send_room_light_debounced
    mode: restart
    then:
      - delay: 100ms
      - script.execute: send_room_light_if_changed

  - id: sync_room_blinds_to_display
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (isnan(id(room_blinds_position).state)) {
                return false;
              }

              const uint32_t now = millis();
              if ((now - id(last_local_blinds_change_ms)) < id(blinds_sync_block_ms)) {
                return false;
              }

              if (id(room_blinds_state).has_state()) {
                if (id(room_blinds_state).state == "opening" || id(room_blinds_state).state == "closing") {
                  return false;
                }
              }

              int v = (int) lroundf(id(room_blinds_position).state);
              if (v < 0) v = 0;
              if (v > 100) v = 100;
              v = ((v + 1) / 2) * 2;
              return v != id(current_blinds_percent);
          then:
            - lambda: |-
                int v = (int) lroundf(id(room_blinds_position).state);
                if (v < 0) v = 0;
                if (v > 100) v = 100;
                v = ((v + 1) / 2) * 2;
                id(current_blinds_percent) = v;
                id(blinds_open) = (v > 0);
                id(last_sent_blinds_percent) = v;
            - if:
                condition:
                  lvgl.page.is_showing: blinds_page
                then:
                  - lambda: "id(syncing_local) = true;"
                  - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                      id: knob_encoder
                      acceleration_mode: HIGH
                  - sensor.viewesmart_rotary_encoder.set_value:
                      id: knob_encoder
                      value: !lambda "return id(current_blinds_percent);"
                  - script.execute: update_blinds_ui

  - id: send_room_blinds_if_changed
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(current_blinds_percent) != id(last_sent_blinds_percent);"
          then:
            - homeassistant.action:
                action: cover.set_cover_position
                data:
                  entity_id: cover.example_blinds
                  position: !lambda "return id(current_blinds_percent);"
            - lambda: |-
                id(last_sent_blinds_percent) = id(current_blinds_percent);
                id(blinds_open) = (id(current_blinds_percent) > 0);

  - id: send_room_blinds_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: send_room_blinds_if_changed

  - id: sync_skylights_to_display
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (isnan(id(skylights_position).state)) {
                return false;
              }

              const uint32_t now = millis();
              if ((now - id(last_local_skylights_change_ms)) < id(blinds_sync_block_ms)) {
                return false;
              }

              if (id(skylights_state).has_state()) {
                if (id(skylights_state).state == "opening" || id(skylights_state).state == "closing") {
                  return false;
                }
              }

              int v = (int) lroundf(id(skylights_position).state);
              if (v < 0) v = 0;
              if (v > 100) v = 100;
              v = ((v + 1) / 2) * 2;
              return v != id(current_skylights_percent);
          then:
            - lambda: |-
                int v = (int) lroundf(id(skylights_position).state);
                if (v < 0) v = 0;
                if (v > 100) v = 100;
                v = ((v + 1) / 2) * 2;
                id(current_skylights_percent) = v;
                id(skylights_open) = (v > 0);
                id(last_sent_skylights_percent) = v;
            - if:
                condition:
                  lvgl.page.is_showing: skylights_page
                then:
                  - lambda: "id(syncing_local) = true;"
                  - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                      id: knob_encoder
                      acceleration_mode: HIGH
                  - sensor.viewesmart_rotary_encoder.set_value:
                      id: knob_encoder
                      value: !lambda "return id(current_skylights_percent);"
                  - script.execute: update_skylights_ui

  - id: send_skylights_if_changed
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(current_skylights_percent) != id(last_sent_skylights_percent);"
          then:
            - homeassistant.action:
                action: cover.set_cover_position
                data:
                  entity_id: cover.example_skylights
                  position: !lambda "return id(current_skylights_percent);"
            - lambda: |-
                id(last_sent_skylights_percent) = id(current_skylights_percent);
                id(skylights_open) = (id(current_skylights_percent) > 0);

  - id: send_skylights_debounced
    mode: restart
    then:
      - delay: 400ms
      - script.execute: send_skylights_if_changed

  - id: send_apple_tv_play_pause
    mode: restart
    then:
      - lambda: |-
          bool currently_playing = id(apple_tv_assumed_state_active)
                                     ? id(apple_tv_assumed_playing)
                                     : (id(apple_tv_state).has_state() && id(apple_tv_state).state == "playing");
          id(apple_tv_assumed_playing) = !currently_playing;
          id(apple_tv_assumed_state_active) = true;
      - script.execute: update_apple_tv_transport_icon
      - homeassistant.action:
          action: media_player.media_play_pause
          data:
            entity_id: media_player.example_apple_tv

  - id: send_apple_tv_left
    mode: restart
    then:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.example_apple_tv
            command: left

  - id: send_apple_tv_right
    mode: restart
    then:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.example_apple_tv
            command: right

  - id: send_apple_tv_menu
    mode: restart
    then:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.example_apple_tv
            command: menu

  - id: send_tv_power_off
    mode: restart
    then:
      - homeassistant.action:
          action: button.press
          data:
            entity_id: button.example_tv_power_off

  - id: send_tv_menu
    mode: restart
    then:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.example_tv
            device: Example_TV
            command: Menu

  - id: send_tv_ok
    mode: restart
    then:
      - homeassistant.action:
          action: remote.send_command
          data:
            entity_id: remote.example_tv
            device: Example_TV
            command: OK/select

  - id: toggle_skylight_blinds
    mode: restart
    then:
      - homeassistant.action:
          action: cover.toggle
          data:
            entity_id: cover.example_skylight_blinds

  - id: toggle_room_loft
    mode: restart
    then:
      - homeassistant.action:
          action: script.example_toggle_ceiling_light

  - id: update_clock_pages
    mode: restart
    then:
      - lvgl.label.update:
          id: digital_clock_value
          text: !lambda |-
            if (!id(homeassistant_time).now().is_valid()) {
              return std::string("--:--");
            }
            auto now = id(homeassistant_time).now();
            char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return std::string(buf);
      - lvgl.line.update:
          id: analog_hour_hand
          points:
            - x: 233
              y: 233
            - x: !lambda |-
                float angle = -90.0f;
                if (id(homeassistant_time).now().is_valid()) {
                  auto now = id(homeassistant_time).now();
                  angle = ((now.hour % 12) + (now.minute / 60.0f)) * 30.0f - 90.0f;
                }
                return (int) lroundf(233.0f + cosf(angle * 3.14159265f / 180.0f) * 98.0f);
              y: !lambda |-
                float angle = -90.0f;
                if (id(homeassistant_time).now().is_valid()) {
                  auto now = id(homeassistant_time).now();
                  angle = ((now.hour % 12) + (now.minute / 60.0f)) * 30.0f - 90.0f;
                }
                return (int) lroundf(233.0f + sinf(angle * 3.14159265f / 180.0f) * 98.0f);
      - lvgl.line.update:
          id: analog_minute_hand
          points:
            - x: 233
              y: 233
            - x: !lambda |-
                float angle = -90.0f;
                if (id(homeassistant_time).now().is_valid()) {
                  auto now = id(homeassistant_time).now();
                  angle = now.minute * 6.0f - 90.0f;
                }
                return (int) lroundf(233.0f + cosf(angle * 3.14159265f / 180.0f) * 150.0f);
              y: !lambda |-
                float angle = -90.0f;
                if (id(homeassistant_time).now().is_valid()) {
                  auto now = id(homeassistant_time).now();
                  angle = now.minute * 6.0f - 90.0f;
                }
                return (int) lroundf(233.0f + sinf(angle * 3.14159265f / 180.0f) * 150.0f);

  - id: update_volume_ui
    mode: restart
    then:
      - lvgl.arc.update:
          id: volume_arc
          value: !lambda "return id(current_volume_percent);"
          indicator:
            arc_color: 0x7005FC
      - lvgl.label.update:
          id: volume_value
          text: !lambda |-
