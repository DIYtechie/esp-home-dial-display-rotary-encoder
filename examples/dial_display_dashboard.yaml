            lvgl.page.is_showing: skylights_page
          then:
            - lambda: "id(page_menu_selection) = 3;"
      - if:
          condition:
            lvgl.page.is_showing: input_page
          then:
            - lambda: "id(page_menu_selection) = 4;"
      - if:
          condition:
            lvgl.page.is_showing: tv_page
          then:
            - lambda: "id(page_menu_selection) = 5;"
      - if:
          condition:
            lvgl.page.is_showing: analog_clock_page
