            - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                id: knob_encoder
                acceleration_mode: LOW
            - sensor.viewesmart_rotary_encoder.set_value:
                id: knob_encoder
                value: !lambda "return id(current_volume_percent);"
            - script.execute: update_volume_ui
          else:
            - if:
                condition:
                  lambda: "return id(page_menu_selection) == 1;"
                then:
                  - lvgl.page.show:
                      id: brightness_page
                  - lambda: "id(syncing_local) = true;"
                  - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                      id: knob_encoder
                      acceleration_mode: HIGH
                  - sensor.viewesmart_rotary_encoder.set_value:
                      id: knob_encoder
                      value: !lambda "return id(current_brightness_percent);"
                  - script.execute: update_brightness_ui
                else:
                  - if:
                      condition:
                        lambda: "return id(page_menu_selection) == 2;"
                      then:
                        - lvgl.page.show:
                            id: blinds_page
                        - lambda: "id(syncing_local) = true;"
                        - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                            id: knob_encoder
                            acceleration_mode: HIGH
                        - sensor.viewesmart_rotary_encoder.set_value:
                            id: knob_encoder
                            value: !lambda "return id(current_blinds_percent);"
                        - script.execute: update_blinds_ui
                      else:
                        - if:
                            condition:
                              lambda: "return id(page_menu_selection) == 3;"
                            then:
                              - lvgl.page.show:
                                  id: skylights_page
                              - lambda: "id(syncing_local) = true;"
                              - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                                  id: knob_encoder
                                  acceleration_mode: HIGH
                              - sensor.viewesmart_rotary_encoder.set_value:
                                  id: knob_encoder
                                  value: !lambda "return id(current_skylights_percent);"
                              - script.execute: update_skylights_ui
                            else:
                              - if:
                                  condition:
                                    lambda: "return id(page_menu_selection) == 4;"
                                  then:
                                    - lvgl.page.show:
                                        id: input_page
                                    - lambda: "id(syncing_local) = true;"
                                    - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                                        id: knob_encoder
                                        acceleration_mode: LOW
                                    - sensor.viewesmart_rotary_encoder.set_value:
                                        id: knob_encoder
                                        value: !lambda |-
                                          if (id(current_input_selection) == 1) return 17;
                                          if (id(current_input_selection) == 2) return 50;
                                          return 83;
                                    - lambda: |-
                                        if (id(current_input_selection) == 1) id(last_input_encoder_value) = 17;
                                        else if (id(current_input_selection) == 2) id(last_input_encoder_value) = 50;
                                        else id(last_input_encoder_value) = 83;
                                    - script.execute: update_input_ui
                                  else:
                                    - if:
                                        condition:
                                          lambda: "return id(page_menu_selection) == 5;"
                                        then:
                                          - lvgl.page.show:
                                              id: tv_page
                                          - lambda: "id(syncing_local) = true;"
                                          - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                                              id: knob_encoder
                                              acceleration_mode: LOW
                                          - sensor.viewesmart_rotary_encoder.set_value:
                                              id: knob_encoder
                                              value: 50
                                        else:
                                          - if:
                                              condition:
                                                lambda: "return id(page_menu_selection) == 6;"
                                              then:
                                                - lvgl.page.show:
                                                    id: analog_clock_page
                                                - lambda: "id(syncing_local) = true;"
                                                - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                                                    id: knob_encoder
                                                    acceleration_mode: LOW
                                                - sensor.viewesmart_rotary_encoder.set_value:
                                                    id: knob_encoder
                                                    value: 50
                                                - script.execute: update_clock_pages
                                              else:
                                                - lvgl.page.show:
                                                    id: digital_clock_page
                                                - lambda: "id(syncing_local) = true;"
                                                - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                                                    id: knob_encoder
                                                    acceleration_mode: LOW
                                                - sensor.viewesmart_rotary_encoder.set_value:
                                                    id: knob_encoder
                                                    value: 50
                                                - script.execute: update_clock_pages

  - id: handle_page_menu_long_press
    mode: restart
    then:
      - delay: 900ms
      - if:
          condition:
            binary_sensor.is_on: knob_button
          then:
            - if:
                condition:
                  lambda: "return id(page_menu_active);"
                then:
                  - lambda: "id(page_menu_selection) = id(page_menu_origin);"
                  - script.execute: show_page_menu_selection
                else:
                  - script.execute: open_page_menu

  - id: handle_knob_double_click
    mode: restart
    then:
      - if:
          condition:
            lvgl.page.is_showing: volume_page
          then:
            - script.execute: send_apple_tv_menu
          else:
            - if:
                condition:
                  lvgl.page.is_showing: brightness_page
                then:
                  - script.execute: toggle_room_loft
                else:
                  - if:
                      condition:
                        lvgl.page.is_showing: blinds_page
                      then:
                        - script.execute: toggle_skylight_blinds

  - id: handle_knob_single_click
    mode: restart
    then:
      - if:
          condition:
            lvgl.page.is_showing: volume_page
          then:
            - script.execute: send_apple_tv_play_pause
          else:
            - if:
                condition:
                  lvgl.page.is_showing: brightness_page
                then:
                  - lambda: |-
                      id(light_on) = !id(light_on);
                      if (id(light_on) && id(current_brightness_percent) == 0) {
                        id(current_brightness_percent) = 100;
                      }
                      id(last_local_brightness_change_ms) = millis();
                  - script.execute: update_brightness_ui
                  - script.execute: send_room_light_if_changed
                  - script.execute: reconcile_room_brightness_after_local
                else:
                  - if:
                      condition:
                        lvgl.page.is_showing: blinds_page
                      then:
                        - lambda: |-
                            if (id(blinds_open)) {
                              id(current_blinds_percent) = 0;
                              id(blinds_open) = false;
                            } else {
                              id(current_blinds_percent) = 100;
                              id(blinds_open) = true;
                            }
                            id(last_local_blinds_change_ms) = millis();
                        - lambda: "id(syncing_local) = true;"
                        - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                            id: knob_encoder
                            acceleration_mode: HIGH
                        - sensor.viewesmart_rotary_encoder.set_value:
                            id: knob_encoder
                            value: !lambda "return id(current_blinds_percent);"
                        - script.execute: update_blinds_ui
                        - script.execute: send_room_blinds_debounced
                      else:
                        - if:
                            condition:
                              lvgl.page.is_showing: skylights_page
                            then:
                              - lambda: |-
                                  if (id(skylights_open)) {
                                    id(current_skylights_percent) = 0;
                                    id(skylights_open) = false;
                                  } else {
                                    id(current_skylights_percent) = 100;
                                    id(skylights_open) = true;
                                  }
                                  id(last_local_skylights_change_ms) = millis();
                              - lambda: "id(syncing_local) = true;"
                              - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                                  id: knob_encoder
                                  acceleration_mode: HIGH
                              - sensor.viewesmart_rotary_encoder.set_value:
                                  id: knob_encoder
                                  value: !lambda "return id(current_skylights_percent);"
                              - script.execute: update_skylights_ui
                              - script.execute: send_skylights_debounced

  - id: rearm_touch_mode_switch
    mode: restart
    then:
      - delay: 350ms
      - lambda: "id(touch_mode_switch_ready) = true;"

  - id: handle_tv_touch_tap
    mode: restart
    then:
      - delay: 225ms
      - if:
          condition:
            lambda: "return id(tv_touch_tap_pending);"
          then:
            - lambda: "id(tv_touch_tap_pending) = false;"
            - if:
                condition:
                  lambda: "return id(tv_touch_sector) == 1;"
                then:
                  - script.execute: send_tv_menu
                else:
                  - if:
                      condition:
                        lambda: "return id(tv_touch_sector) == 2;"
                      then:
                        - script.execute: send_tv_power_off
                      else:
                        - if:
                            condition:
                              lambda: "return id(tv_touch_sector) == 3;"
                            then:
                              - script.execute: send_tv_ok

  - id: handle_center_touch_tap
    mode: restart
    then:
      - delay: 225ms
      - if:
          condition:
            lambda: |-
              return id(center_touch_tap_pending) && id(touch_mode_switch_ready);
          then:
            - lambda: |-
                id(center_touch_tap_pending) = false;
                id(touch_mode_switch_ready) = false;
            - if:
                condition:
                  lambda: "return id(page_menu_active);"
                then:
                  - script.execute: show_page_menu_selection
                else:
                  - if:
                      condition:
                        lvgl.page.is_showing: volume_page
                      then:
                        - logger.log: "CENTER TAP PLAY/PAUSE"
                        - script.execute: send_apple_tv_play_pause
                      else:
                        - logger.log: "CENTER TAP"
            - script.execute: rearm_touch_mode_switch

i2c:
  sda: GPIO1
  scl: GPIO3
  scan: true

spi:
  id: display_qspi
  type: quad
  clk_pin: GPIO10
  data_pins: [GPIO13, GPIO11, GPIO14, GPIO9]

display:
  - platform: mipi_spi
    id: round_display
    model: CO5300
    bus_mode: quad
    cs_pin: GPIO12
    reset_pin: GPIO8
    enable_pin: GPIO17
    dimensions:
      width: 466
      height: 466
      offset_width: 6
    update_interval: never
    auto_clear_enabled: false
    color_order: rgb

sensor:
  - platform: homeassistant
    id: receiver_volume_level
    entity_id: media_player.example_receiver
    attribute: volume_level
    internal: true
    accuracy_decimals: 2
    on_value:
      then:
        - script.execute: sync_receiver_volume_to_display

  - platform: homeassistant
    id: room_light_brightness
    entity_id: light.example_room
    attribute: brightness
    internal: true
    accuracy_decimals: 0
    on_value:
      then:
        - script.execute: sync_room_brightness_to_display

  - platform: homeassistant
    id: room_blinds_position
    entity_id: cover.example_blinds
    attribute: current_position
    internal: true
    accuracy_decimals: 0
    on_value:
      then:
        - script.execute: sync_room_blinds_to_display

  - platform: homeassistant
    id: skylights_position
    entity_id: cover.example_skylights
    attribute: current_position
    internal: true
    accuracy_decimals: 0
    on_value:
      then:
        - script.execute: sync_skylights_to_display

  - platform: viewesmart_rotary_encoder
    id: knob_encoder
    name: "Knob value"
    pin_a:
      number: GPIO6
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO5
      mode:
        input: true
        pullup: true
    resolution: 2
    min_value: 0
    max_value: 100
    restore_mode: ALWAYS_ZERO
    publish_initial_value: true
    acceleration_mode: HIGH

    on_value:
      then:
        - script.execute: wake_display_if_needed
        - script.execute: mark_display_activity
        - if:
            condition:
              lambda: |-
                if (!id(syncing_local)) return false;

                int expected = 50;
                if (id(page_menu_active)) {
                  expected = id(page_menu_encoder_value);
                } else if (id(brightness_page)->is_showing()) {
                  expected = id(current_brightness_percent);
                } else if (id(blinds_page)->is_showing()) {
                  expected = id(current_blinds_percent);
                } else if (id(skylights_page)->is_showing()) {
                  expected = id(current_skylights_percent);
                } else if (id(input_page)->is_showing()) {
                  expected = id(last_input_encoder_value);
                } else if (id(volume_page)->is_showing()) {
                  expected = std::min(id(current_volume_percent), id(max_volume_percent));
                }

                id(syncing_local) = false;
                return ((int) x) == expected;
            then:
              - lambda: |-
                  // Ignore only the value published by a programmatic set_value.
                  return;
            else:
              - if:
                  condition:
                    lvgl.page.is_showing: brightness_page
                  then:
                    - if:
                        condition:
                          lambda: |-
                            const int raw = (int) x;
                            int current = ((id(current_brightness_percent) + 1) / 2) * 2;
                            int v = current;
                            if (raw > current) v = std::min(100, current + 2);
                            else if (raw < current) v = std::max(0, current - 2);
                            return v != id(current_brightness_percent) || (v == 0 && id(light_on)) || (v > 0 && !id(light_on));
                        then:
                          - lambda: |-
                              const int raw = (int) x;
                              int current = ((id(current_brightness_percent) + 1) / 2) * 2;
                              int v = current;
                              if (raw > current) v = std::min(100, current + 2);
                              else if (raw < current) v = std::max(0, current - 2);
                              id(current_brightness_percent) = v;
                              id(light_on) = (v > 0);
                              id(last_local_brightness_change_ms) = millis();
                          - lambda: "id(syncing_local) = true;"
                          - sensor.viewesmart_rotary_encoder.set_value:
                              id: knob_encoder
                              value: !lambda "return id(current_brightness_percent);"
                          - script.execute: update_brightness_ui
                          - script.execute: send_room_light_debounced
                          - script.execute: reconcile_room_brightness_after_local
                  else:
                    - if:
                        condition:
                          lvgl.page.is_showing: blinds_page
                        then:
                          - if:
                              condition:
                                lambda: |-
                                  const int raw = (int) x;
                                  int current = ((id(current_blinds_percent) + 1) / 2) * 2;
                                  int v = current;
                                  if (raw > current) v = std::min(100, current + 2);
                                  else if (raw < current) v = std::max(0, current - 2);
                                  return v != id(current_blinds_percent);
                              then:
                                - lambda: |-
                                    const int raw = (int) x;
                                    int current = ((id(current_blinds_percent) + 1) / 2) * 2;
                                    int v = current;
                                    if (raw > current) v = std::min(100, current + 2);
                                    else if (raw < current) v = std::max(0, current - 2);
                                    id(current_blinds_percent) = v;
                                    id(blinds_open) = (v > 0);
                                    id(last_local_blinds_change_ms) = millis();
                                - lambda: "id(syncing_local) = true;"
                                - sensor.viewesmart_rotary_encoder.set_value:
                                    id: knob_encoder
                                    value: !lambda "return id(current_blinds_percent);"
                                - script.execute: update_blinds_ui
                                - script.execute: send_room_blinds_debounced
                        else:
                          - if:
                              condition:
                                lvgl.page.is_showing: skylights_page
                              then:
                                - if:
                                    condition:
                                      lambda: |-
                                        const int raw = (int) x;
                                        int current = ((id(current_skylights_percent) + 1) / 2) * 2;
                                        int v = current;
                                        if (raw > current) v = std::min(100, current + 2);
                                        else if (raw < current) v = std::max(0, current - 2);
                                        return v != id(current_skylights_percent);
                                    then:
                                      - lambda: |-
                                          const int raw = (int) x;
                                          int current = ((id(current_skylights_percent) + 1) / 2) * 2;
                                          int v = current;
                                          if (raw > current) v = std::min(100, current + 2);
                                          else if (raw < current) v = std::max(0, current - 2);
                                          id(current_skylights_percent) = v;
                                          id(skylights_open) = (v > 0);
                                          id(last_local_skylights_change_ms) = millis();
                                      - lambda: "id(syncing_local) = true;"
                                      - sensor.viewesmart_rotary_encoder.set_value:
                                          id: knob_encoder
                                          value: !lambda "return id(current_skylights_percent);"
                                      - script.execute: update_skylights_ui
                                      - script.execute: send_skylights_debounced
                              else:
                                - if:
                                    condition:
                                      lvgl.page.is_showing: input_page
                                    then:
                                      - if:
                                          condition:
                                            lambda: |-
                                              return ((int) x) != id(last_input_encoder_value);
                                          then:
                                            - lambda: |-
                                                const int raw = (int) x;
                                                const int delta = raw - id(last_input_encoder_value);
                                                bool changed = false;
                                                if (delta > 0 && id(current_input_selection) < 3) {
                                                  id(current_input_selection) += 1;
                                                  changed = true;
                                                } else if (delta < 0 && id(current_input_selection) > 1) {
                                                  id(current_input_selection) -= 1;
                                                  changed = true;
                                                }
                                                id(last_input_encoder_value) = raw;
                                                if (!changed) {
                                                  return;
                                                }
                                            - script.execute: update_input_ui
                                            - script.execute: send_selected_source
                                    else:
                                      - if:
                                          condition:
                                            lvgl.page.is_showing: tv_page
                                          then:
                                            - lambda: |-
                                                return;
                                          else:
                                            - if:
                                                condition:
                                                  lvgl.page.is_showing: analog_clock_page
                                                then:
                                                  - lambda: |-
                                                      return;
                                                else:
                                                  - if:
                                                      condition:
                                                        lvgl.page.is_showing: digital_clock_page
                                                      then:
                                                        - lambda: |-
                                                            return;
                                                      else:
                                                        - if:
                                                            condition:
                                                              lambda: |-
                                                                return id(page_menu_active);
                                                            then:
                                                              - lambda: |-
                                                                  const int raw = (int) x;
                                                                  const int delta = raw - id(page_menu_encoder_value);
                                                                  id(page_menu_encoder_value) = raw;
                                                                  if (id(knob_button).state) {
                                                                    return;
                                                                  }
                                                                  if (delta > 0) {
                                                                    id(page_menu_selection) = (id(page_menu_selection) + 7) % 8;
                                                                  } else if (delta < 0) {
                                                                    id(page_menu_selection) = (id(page_menu_selection) + 1) % 8;
                                                                  } else {
                                                                    return;
                                                                  }
                                                              - script.execute: update_page_menu_ui
                                                            else:
                                                              - if:
                                                                  condition:
                                                                    lambda: |-
                                                                      int raw = (int) x;
                                                                      int v = raw;
                                                                      if (v < 0) v = 0;
                                                                      if (v > id(max_volume_percent)) v = id(max_volume_percent);
                                                                      return v != id(current_volume_percent) || raw > id(max_volume_percent);
                                                                  then:
                                                                    - lambda: |-
                                                                        int raw = (int) x;
                                                                        int v = raw;
                                                                        if (v < 0) v = 0;
                                                                        if (v > id(max_volume_percent)) v = id(max_volume_percent);
                                                                        if (v != id(current_volume_percent)) {
                                                                          id(current_volume_percent) = v;
                                                                          id(last_local_volume_change_ms) = millis();
                                                                        }
                                                                    - if:
                                                                        condition:
                                                                          lambda: "return (int)x > id(max_volume_percent);"
                                                                        then:
                                                                          - lambda: "id(syncing_local) = true;"
                                                                          - sensor.viewesmart_rotary_encoder.set_value:
                                                                              id: knob_encoder
                                                                              value: !lambda "return id(max_volume_percent);"
                                                                    - script.execute: update_volume_ui
                                                                    - script.execute: send_receiver_volume_debounced

number:
  - platform: template
    id: display_brightness_slider
    name: "Dial Display Brightness"
    optimistic: true
    restore_value: true
    initial_value: 208
    min_value: 0
    max_value: 255
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          id(display_brightness) = (int) x;
          if (id(display_enabled)) {
            id(round_display).set_brightness(id(display_brightness));
          }

switch:
  - platform: template
    id: display_power_switch
    name: "Dial Display Screen"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    lambda: |-
      return id(display_enabled);
    turn_on_action:
      - lambda: |-
          id(display_enabled) = true;
          id(round_display).set_brightness(id(display_brightness));
          id(last_user_interaction_ms) = millis();
      - lvgl.resume:
      - script.execute: update_volume_ui
      - script.execute: update_brightness_ui
      - script.execute: update_blinds_ui
      - script.execute: update_skylights_ui
      - script.execute: update_input_ui
      - script.execute: update_clock_pages
    turn_off_action:
      - lambda: |-
          id(display_enabled) = false;
          id(round_display).set_brightness(0);
      - lvgl.pause:

binary_sensor:
  - platform: homeassistant
    id: room_light_is_on
    entity_id: light.example_room
    internal: true
    on_state:
      then:
        - script.execute: sync_room_brightness_to_display

  - platform: viewesmart_knob_button
    id: knob_button
    name: "Knob Button"
    debounce_time: 15ms

    on_press:
      then:
        - script.execute: wake_display_if_needed
        - script.execute: mark_display_activity
        - script.execute: handle_page_menu_long_press

    on_release:
      then:
        - script.stop: handle_page_menu_long_press

    on_multi_click:
      - timing:
          - ON for at most 500ms
          - OFF for at most 350ms
          - ON for at most 500ms
          - OFF for at least 50ms
        then:
          - script.execute: wake_display_if_needed
          - script.execute: mark_display_activity
          - script.execute: handle_knob_double_click
      - timing:
          - ON for at most 700ms
          - OFF for at least 350ms
        then:
          - script.execute: wake_display_if_needed
          - script.execute: mark_display_activity
          - if:
              condition:
                lambda: "return id(page_menu_active);"
              then:
                - script.execute: show_page_menu_selection
              else:
                - script.execute: handle_knob_single_click

touchscreen:
  platform: viewesmart_touchscreen
  id: board_touch
  display: round_display
  interrupt_pin: GPIO4
  update_interval: 16ms
  on_swipe_left:
    then:
      - lambda: "id(center_touch_tap_pending) = false;"
      - lambda: "id(tv_touch_tap_pending) = false;"
      - script.execute: mark_display_activity
      - if:
          condition:
            lambda: "return !id(display_enabled);"
          then:
            - switch.turn_on: display_power_switch
          else:
            - logger.log: "SWIPE LEFT"
            - if:
                condition:
                  lvgl.page.is_showing: volume_page
                then:
                  - script.execute: send_apple_tv_right
  on_swipe_right:
    then:
      - lambda: "id(center_touch_tap_pending) = false;"
      - lambda: "id(tv_touch_tap_pending) = false;"
      - script.execute: mark_display_activity
      - if:
          condition:
            lambda: "return !id(display_enabled);"
          then:
            - switch.turn_on: display_power_switch
          else:
            - logger.log: "SWIPE RIGHT"
            - if:
                condition:
                  lvgl.page.is_showing: volume_page
                then:
                  - script.execute: send_apple_tv_left
  on_swipe_up:
    then:
      - lambda: "id(center_touch_tap_pending) = false;"
      - lambda: "id(tv_touch_tap_pending) = false;"
      - script.execute: mark_display_activity
      - if:
          condition:
            lambda: "return !id(display_enabled);"
          then:
            - switch.turn_on: display_power_switch
          else:
            - if:
                condition:
                  lambda: "return id(page_menu_active);"
                then:
                  - lambda: |-
                      // Touch navigation is disabled in the page menu.
                      return;
                else:
                  - logger.log: "SWIPE UP"
                  - script.execute: cycle_mode_reverse
  on_swipe_down:
    then:
      - lambda: "id(center_touch_tap_pending) = false;"
      - lambda: "id(tv_touch_tap_pending) = false;"
      - script.execute: mark_display_activity
      - if:
          condition:
            lambda: "return !id(display_enabled);"
          then:
            - switch.turn_on: display_power_switch
          else:
            - if:
                condition:
                  lambda: "return id(page_menu_active);"
                then:
                  - lambda: |-
                      // Touch navigation is disabled in the page menu.
                      return;
                else:
                  - logger.log: "SWIPE DOWN"
                  - script.execute: cycle_mode
  on_touch:
    then:
      - script.execute: mark_display_activity
      - lambda: "id(center_touch_tap_pending) = false;"
      - lambda: "id(tv_touch_tap_pending) = false;"
      - if:
          condition:
            lambda: "return !id(display_enabled);"
          then:
            - switch.turn_on: display_power_switch
          else:
            - logger.log:
                format: "Touch x=%d y=%d"
                args: ["touch.x", "touch.y"]
            - if:
                condition:
                  lvgl.page.is_showing: tv_page
                then:
                  - lambda: |-
                      const float dx = touch.x - 233.0f;
                      const float dy = 233.0f - touch.y;
                      float angle = atan2f(dy, dx) * 180.0f / 3.14159265f;
                      if (angle < 0.0f) angle += 360.0f;
                      if (angle >= 150.0f && angle < 270.0f) {
                        id(tv_touch_sector) = 1;
                      } else if (angle >= 30.0f && angle < 150.0f) {
                        id(tv_touch_sector) = 2;
                      } else {
                        id(tv_touch_sector) = 3;
                      }
                      id(tv_touch_tap_pending) = true;
                  - script.execute: handle_tv_touch_tap
                else:
                  - if:
                      condition:
                        lambda: |-
                          return !id(page_menu_active) &&
                                 id(touch_mode_switch_ready) &&
                                 touch.x >= 160 && touch.x <= 306 &&
                                 touch.y >= 160 && touch.y <= 306;
                      then:
                        - lambda: "id(center_touch_tap_pending) = true;"
                        - script.execute: handle_center_touch_tap

interval:
  - interval: 30s
    then:
      - script.execute: sync_room_blinds_to_display
      - script.execute: sync_skylights_to_display
      - if:
          condition:
            lambda: |-
              return id(display_enabled) &&
                     (millis() - id(last_user_interaction_ms)) >= id(display_idle_timeout_ms);
          then:
            - switch.turn_off: display_power_switch

