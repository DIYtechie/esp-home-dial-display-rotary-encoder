  - id: sync_selected_source_to_display
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (!id(receiver_source).has_state()) {
                return false;
              }
              if ((millis() - id(last_local_source_change_ms)) < 2000) {
                return false;
              }
              return id(receiver_source).state == "Game Console" ||
                     id(receiver_source).state == "Apple TV" ||
                     id(receiver_source).state == "Camera";
          then:
            - lambda: |-
                int desired = id(current_input_selection);
                if (id(receiver_source).state == "Game Console") {
                  desired = 1;
                } else if (id(receiver_source).state == "Apple TV") {
                  desired = 2;
                } else if (id(receiver_source).state == "Camera") {
                  desired = 3;
                }

                if (desired == id(current_input_selection)) {
                  return;
                }

                id(current_input_selection) = desired;
            - script.execute: update_input_ui
            - if:
                condition:
                  lvgl.page.is_showing: input_page
                then:
                  - lambda: "id(syncing_local) = true;"
                  - sensor.viewesmart_rotary_encoder.set_acceleration_mode:
                      id: knob_encoder
                      acceleration_mode: LOW
                  - sensor.viewesmart_rotary_encoder.set_value:
                      id: knob_encoder
                      value: !lambda |-
                        if (id(current_input_selection) == 1) return 17;
                        if (id(current_input_selection) == 2) return 50;
                        return 83;
                  - lambda: |-
                      if (id(current_input_selection) == 1) id(last_input_encoder_value) = 17;
                      else if (id(current_input_selection) == 2) id(last_input_encoder_value) = 50;
                      else id(last_input_encoder_value) = 83;

