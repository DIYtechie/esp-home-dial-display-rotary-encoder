  - id: update_page_menu_drag_styles
    mode: restart
    then:
      - lambda: |-
          lv_obj_t *labels[] = {
            id(page_menu_item_minus_3),
            id(page_menu_item_minus_2),
            id(page_menu_item_minus_1),
            id(page_menu_item_selected),
            id(page_menu_item_plus_1),
            id(page_menu_item_plus_2),
            id(page_menu_item_plus_3),
          };
          const int positions[] = {-216, -144, -72, 0, 72, 144, 216};

          for (int i = 0; i < 7; i++) {
            const int y = positions[i] + id(page_menu_drag_offset);
            const int distance = std::abs(y);
            const lv_font_t *font;
            if (distance < 33) {
              font = &lv_font_montserrat_42;
            } else if (distance < 98) {
              font = &lv_font_montserrat_32;
            } else if (distance < 163) {
              font = &lv_font_montserrat_28;
            } else {
              font = &lv_font_montserrat_24;
            }

            int shade;
            if (distance <= 65) {
              shade = 255 - (136 * distance / 65);
            } else if (distance <= 130) {
              shade = 119 - (50 * (distance - 65) / 65);
            } else if (distance <= 195) {
              shade = 69 - (33 * (distance - 130) / 65);
            } else {
              shade = 36;
            }

            lv_obj_set_y(labels[i], y);
            lv_obj_set_style_text_font(labels[i], font, LV_PART_MAIN);
            lv_obj_set_style_text_color(labels[i], lv_color_make(shade, shade, shade), LV_PART_MAIN);
          }

  - id: update_page_menu_ui
    mode: restart
    then:
      - lambda: |-
          static const char *const names[] = {
            "VOLUME", "LIGHTS", "BLINDS", "SKYLIGHTS",
            "SOURCE", "TV", "ANALOG CLOCK", "DIGITAL CLOCK"
          };
          lv_obj_t *labels[] = {
            id(page_menu_item_minus_3),
            id(page_menu_item_minus_2),
            id(page_menu_item_minus_1),
            id(page_menu_item_selected),
            id(page_menu_item_plus_1),
            id(page_menu_item_plus_2),
            id(page_menu_item_plus_3),
          };
          const int relative_indices[] = {-3, -2, -1, 0, 1, 2, 3};
          for (int i = 0; i < 7; i++) {
            const int index =
                (id(page_menu_selection) + relative_indices[i] + 8) % 8;
            lv_label_set_text(labels[i], names[index]);
          }
      - script.execute: update_page_menu_drag_styles

  - id: finish_page_menu_drag
    mode: restart
    then:
      - lambda: |-
          id(page_menu_drag_active) = false;
          int steps = 0;
          if (id(page_menu_drag_offset) <= -24) {
            steps = 1;
          } else if (id(page_menu_drag_offset) >= 24) {
            steps = -1;
          }
          id(page_menu_drag_snap_steps) = steps;

          const int target = -steps * 65;
          lv_anim_t animation;
          lv_anim_init(&animation);
          lv_anim_set_var(&animation, id(page_menu_list_track));
          lv_anim_set_values(&animation, id(page_menu_drag_offset), target);
          lv_anim_set_time(&animation, 130);
          lv_anim_set_path_cb(&animation, lv_anim_path_ease_out);
          lv_anim_set_exec_cb(&animation, [](void *object, int32_t value) {
            id(page_menu_drag_offset) = value;
            lv_obj_t *labels[] = {
              id(page_menu_item_minus_3),
              id(page_menu_item_minus_2),
              id(page_menu_item_minus_1),
              id(page_menu_item_selected),
              id(page_menu_item_plus_1),
              id(page_menu_item_plus_2),
              id(page_menu_item_plus_3),
            };
            const int positions[] = {-216, -144, -72, 0, 72, 144, 216};

            for (int i = 0; i < 7; i++) {
              const int y = positions[i] + value;
              const int distance = std::abs(y);
              const lv_font_t *font;
              if (distance < 33) {
                font = &lv_font_montserrat_42;
              } else if (distance < 98) {
                font = &lv_font_montserrat_32;
              } else if (distance < 163) {
                font = &lv_font_montserrat_28;
              } else {
                font = &lv_font_montserrat_24;
              }

              int shade;
              if (distance <= 65) {
                shade = 255 - (136 * distance / 65);
              } else if (distance <= 130) {
                shade = 119 - (50 * (distance - 65) / 65);
              } else if (distance <= 195) {
                shade = 69 - (33 * (distance - 130) / 65);
              } else {
                shade = 36;
              }

              lv_obj_set_y(labels[i], y);
              lv_obj_set_style_text_font(labels[i], font, LV_PART_MAIN);
              lv_obj_set_style_text_color(
                  labels[i], lv_color_make(shade, shade, shade), LV_PART_MAIN);
            }
          });
          lv_anim_start(&animation);
      - delay: 140ms
      - lambda: |-
          id(page_menu_selection) =
              (id(page_menu_selection) + id(page_menu_drag_snap_steps) + 80) % 8;
          id(page_menu_drag_offset) = 0;
          id(page_menu_drag_snap_steps) = 0;
      - script.execute: update_page_menu_ui

